version: "3.9"

services:
  api:
    build: .
    container_name: xml_pipeline_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/xml_pipeline
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: xml_pipeline_db
    restart: always
    environment:
      POSTGRES_DB: xml_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"