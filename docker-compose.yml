services:
  api:
    build: .
    container_name: xml_pipeline_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/xml_pipeline
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15
    container_name: xml_pipeline_db
    restart: always
    environment:
      POSTGRES_DB: xml_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xml_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5
